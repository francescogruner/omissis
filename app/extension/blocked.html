<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omissis</title>
<style>
  :root { color-scheme: light dark; --background: #fff; --text: #171717; --text-2: #5c5c5c; --border: #eaeaea; --error: #c50f1f; --error-background: #ffecec; }
  @media (prefers-color-scheme: dark) { :root { --background: #0a0a0a; --text: #ededed; --text-2: #a1a1a1; --border: #262626; --error: #ff6369; --error-background: #361416; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--background); color: var(--text); font: 15px/1.55 "Geist", "Inter", system-ui, "Segoe UI", sans-serif; }
  main { max-width: 440px; margin: 24px; padding: 32px; border: 1px solid var(--border); border-radius: 8px; }
  .sign { display: inline-flex; align-items: center; gap: 8px; padding: 2px 10px; border-radius: 99px; background: var(--error-background); color: var(--error); font-size: 13px; font-weight: 500; }
  .sign svg { width: 14px; height: 14px; }
  h1 { margin: 16px 0 8px; font-size: 22px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.25; }
  p { margin: 8px 0 0; color: var(--text-2); }
  footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  footer svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<main>
  <span class="sign"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></svg><span id="sign"></span></span>
  <h1 id="title"></h1>
  <p id="text"></p>
  <p id="ask"></p>
  <footer><svg viewBox="0 0 64 64" aria-hidden="true"><polygon points="32,4 58,14 58,34 32,60 6,34 6,14" fill="currentColor"/><polyline points="20,32 29,41 45,23" fill="none" stroke="var(--background)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>Omissis</footer>
</main>
<script src="blocked.js"></script>
</body>
</html>
