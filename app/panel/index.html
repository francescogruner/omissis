<!doctype html>
<html lang="__LINGUA__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="omissis-code" content="__CODICE__">
<title>Omissis</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body class="simple">
<a class="skip" href="#content" id="skip"></a>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#/start">
      <svg viewBox="0 0 64 64" aria-hidden="true"><polygon points="32,4 58,14 58,34 32,60 6,34 6,14" fill="currentColor"/><polyline points="20,32 29,41 45,23" fill="none" stroke="var(--background-2)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Omissis</span>
    </a>
    <nav class="menu" id="menu"></nav>
    <div class="side-footer">
      <a class="side-status" href="#/start" id="sideStatus"><span class="point" id="sidePoint"></span><span id="sideText"></span></a>
      <label class="line"><span class="toggle"><input type="checkbox" id="advanced" role="switch"><span></span></span><span id="advancedText"></span></label>
      <span class="version" id="version"></span>
      <a class="version" id="contact" target="_blank" rel="noopener"></a>
    </div>
  </aside>
  <div class="body">
    <main id="content" tabindex="-1"></main>
  </div>
</div>
<div class="notices" id="notices" role="status" aria-live="polite"></div>
<dialog id="confirm" aria-labelledby="confirmTitle">
  <div class="inside"><h2 id="confirmTitle"></h2><p class="faded" id="confirmText"></p></div>
  <form method="dialog" class="footer"><button class="button" value="no" id="confirmNo"></button><button class="button primary" value="yes" id="confirmYes"></button></form>
</dialog>
<dialog id="lighter" aria-labelledby="lighterTitle">
  <div class="inside"><h2 id="lighterTitle"></h2><p class="faded" id="lighterText"></p></div>
  <div class="footer"><button class="button" id="lighterNo"></button><button class="button primary" id="lighterYes"></button></div>
</dialog>
<dialog id="report" aria-labelledby="reportTitle">
  <div class="inside"><h2 id="reportTitle"></h2><p class="faded" id="reportIntro"></p>
    <label class="small" for="reportNote" id="reportNoteLabel"></label><textarea id="reportNote" rows="2"></textarea>
    <span class="small" id="reportContentLabel"></span><pre id="reportText" tabindex="0" aria-labelledby="reportContentLabel"></pre>
    <p class="small faded" id="reportGithubNote"></p></div>
  <div class="footer"><a class="button" id="reportContact" target="_blank" rel="noopener"></a><span class="space"></span><button class="button" id="reportClose"></button><button class="button" id="reportCopy"></button><button class="button primary" id="reportGithub"></button></div>
</dialog>
<dialog id="welcome" aria-labelledby="welcomeTitle" tabindex="-1"></dialog>
<noscript>Omissis: questa pagina ha bisogno di JavaScript. This page needs JavaScript.</noscript>
<script src="/app.js" type="module"></script>
</body>
</html>
