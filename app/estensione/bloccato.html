<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omissis</title>
<style>
  :root { color-scheme: light dark; --sfondo: #fff; --testo: #171717; --testo-2: #5c5c5c; --bordo: #eaeaea; --errore: #c50f1f; --errore-sfondo: #ffecec; }
  @media (prefers-color-scheme: dark) { :root { --sfondo: #0a0a0a; --testo: #ededed; --testo-2: #a1a1a1; --bordo: #262626; --errore: #ff6369; --errore-sfondo: #361416; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--sfondo); color: var(--testo); font: 15px/1.55 "Geist", "Inter", system-ui, "Segoe UI", sans-serif; }
  main { max-width: 440px; margin: 24px; padding: 32px; border: 1px solid var(--bordo); border-radius: 8px; }
  .segno { display: inline-flex; align-items: center; gap: 8px; padding: 2px 10px; border-radius: 99px; background: var(--errore-sfondo); color: var(--errore); font-size: 13px; font-weight: 500; }
  .segno svg { width: 14px; height: 14px; }
  h1 { margin: 16px 0 8px; font-size: 22px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.25; }
  p { margin: 8px 0 0; color: var(--testo-2); }
  footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--bordo); display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  footer svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<main>
  <span class="segno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></svg><span id="segno"></span></span>
  <h1 id="titolo"></h1>
  <p id="testo"></p>
  <p id="chiedi"></p>
  <footer><svg viewBox="0 0 64 64" aria-hidden="true"><polygon points="32,4 58,14 58,34 32,60 6,34 6,14" fill="currentColor"/><polyline points="20,32 29,41 45,23" fill="none" stroke="var(--sfondo)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>Omissis</footer>
</main>
<script src="bloccato.js"></script>
</body>
</html>
